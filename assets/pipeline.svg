<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="1200" height="140" role="img" aria-label="Animated pipeline: commit, build, test, deploy, observe.">
  <defs>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .node { fill: #161b22; stroke-width: 1.5; }
    .name { font-size: 14px; fill: #e6edf3; font-weight: 600; }
    .tool { font-size: 11px; fill: #8b949e; }
  </style>

  <text x="30" y="22" class="mono" font-size="12" fill="#8b949e"><tspan fill="#3fb950">$</tspan> git push origin main</text>

  <!-- track -->
  <line x1="30" y1="66" x2="1170" y2="66" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- packet travelling the track (drawn under the nodes, so it shows in the gaps) -->
  <g>
    <rect x="-46" y="-1.5" width="46" height="3" rx="1.5" fill="url(#tail)"/>
    <circle r="4.5" fill="#79c0ff"/>
    <animateMotion path="M30 66 H1170" keyPoints="0;1;1" keyTimes="0;0.75;1" calcMode="linear" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.75" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
  </g>

  <!-- commit -->
  <g>
    <rect class="node" x="30" y="44" width="180" height="44" rx="10" stroke="#3fb950">
      <animate attributeName="stroke" values="#d29922;#3fb950;#30363d" keyTimes="0;0.1184;0.97" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
    </rect>
    <circle cx="52" cy="66" r="5" fill="#3fb950">
      <animate attributeName="fill" values="#d29922;#3fb950;#6e7681" keyTimes="0;0.1184;0.97" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
    </circle>
    <text x="68" y="71" class="mono name">commit</text>
    <text x="120" y="110" text-anchor="middle" class="mono tool">git</text>
  </g>

  <!-- build -->
  <g>
    <rect class="node" x="270" y="44" width="180" height="44" rx="10" stroke="#3fb950">
      <animate attributeName="stroke" values="#30363d;#d29922;#3fb950;#30363d" keyTimes="0;0.1579;0.2763;0.97" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
    </rect>
    <circle cx="292" cy="66" r="5" fill="#3fb950">
      <animate attributeName="fill" values="#6e7681;#d29922;#3fb950;#6e7681" keyTimes="0;0.1579;0.2763;0.97" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
    </circle>
    <text x="308" y="71" class="mono name">build</text>
    <text x="360" y="110" text-anchor="middle" class="mono tool">docker</text>
  </g>

  <!-- test -->
  <g>
    <rect class="node" x="510" y="44" width="180" height="44" rx="10" stroke="#3fb950">
      <animate attributeName="stroke" values="#30363d;#d29922;#3fb950;#30363d" keyTimes="0;0.3158;0.4342;0.97" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
    </rect>
    <circle cx="532" cy="66" r="5" fill="#3fb950">
      <animate attributeName="fill" values="#6e7681;#d29922;#3fb950;#6e7681" keyTimes="0;0.3158;0.4342;0.97" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
    </circle>
    <text x="548" y="71" class="mono name">test</text>
    <text x="600" y="110" text-anchor="middle" class="mono tool">jest · pytest · playwright</text>
  </g>

  <!-- deploy -->
  <g>
    <rect class="node" x="750" y="44" width="180" height="44" rx="10" stroke="#3fb950">
      <animate attributeName="stroke" values="#30363d;#d29922;#3fb950;#30363d" keyTimes="0;0.4737;0.5921;0.97" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
    </rect>
    <circle cx="772" cy="66" r="5" fill="#3fb950">
      <animate attributeName="fill" values="#6e7681;#d29922;#3fb950;#6e7681" keyTimes="0;0.4737;0.5921;0.97" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
    </circle>
    <text x="788" y="71" class="mono name">deploy</text>
    <text x="840" y="110" text-anchor="middle" class="mono tool">kubernetes · argo cd</text>
  </g>

  <!-- observe -->
  <g>
    <rect class="node" x="990" y="44" width="180" height="44" rx="10" stroke="#3fb950">
      <animate attributeName="stroke" values="#30363d;#d29922;#3fb950;#30363d" keyTimes="0;0.6316;0.75;0.97" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
    </rect>
    <circle cx="1012" cy="66" r="5" fill="#3fb950">
      <animate attributeName="fill" values="#6e7681;#d29922;#3fb950;#6e7681" keyTimes="0;0.6316;0.75;0.97" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
    </circle>
    <text x="1028" y="71" class="mono name">observe</text>
    <text x="1080" y="110" text-anchor="middle" class="mono tool">prometheus · grafana</text>
  </g>
</svg>
