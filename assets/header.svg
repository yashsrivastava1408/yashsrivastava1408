<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Yash Srivastava. DevOps, Platform Engineering, Applied AI. Building systems that don't break at 3am.">
  <defs>
    <clipPath id="card"><rect x="0.5" y="0.5" width="1199" height="299" rx="16"/></clipPath>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d"/>
    </pattern>
    <radialGradient id="glowBlue">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple">
      <stop offset="0" stop-color="#a371f7" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#79c0ff"/>
      <stop offset="0.55" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#58a6ff"/>
      <stop offset="0.6" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#a371f7" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1200 0;1200 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="type1">
      <rect x="20" y="-16" height="24" width="394">
        <animate attributeName="width" values="0;394;394;0;0" keyTimes="0;0.16;0.42;0.49;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="type2">
      <rect x="20" y="-16" height="24" width="0">
        <animate attributeName="width" values="0;0;509;509;0" keyTimes="0;0.5;0.68;0.93;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .rise { animation: rise 0.9s ease-out both; }
    .rise.d1 { animation-delay: 0.15s; }
    .rise.d2 { animation-delay: 0.3s; }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .rise, .cur { animation: none; } }
  </style>

  <rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="#0d1117" stroke="#30363d"/>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#dots)" opacity="0.35"/>
    <circle cx="980" cy="60" r="260" fill="url(#glowBlue)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-50 24;0 0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="300" r="240" fill="url(#glowPurple)">
      <animateTransform attributeName="transform" type="translate" values="0 0;44 -20;0 0" dur="16s" repeatCount="indefinite"/>
    </circle>
    <rect x="0" y="297" width="1200" height="3" fill="url(#sweep)"/>
  </g>

  <!-- terminal bar -->
  <circle cx="36" cy="34" r="6" fill="#ff5f57"/>
  <circle cx="56" cy="34" r="6" fill="#febc2e"/>
  <circle cx="76" cy="34" r="6" fill="#28c840"/>
  <text x="100" y="38.5" class="mono" font-size="13" fill="#6e7681">yash@prod: ~</text>

  <rect x="938" y="20" width="238" height="28" rx="14" fill="#161b22" stroke="#30363d"/>
  <circle cx="957" cy="34" r="4" fill="#3fb950" opacity="0.6">
    <animate attributeName="r" values="4;10" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="957" cy="34" r="4" fill="#3fb950"/>
  <text x="970" y="38.5" class="mono" font-size="12" fill="#8b949e">B.Tech CSE · SRM IST · 2027</text>

  <line x1="0.5" y1="66" x2="1199.5" y2="66" stroke="#21262d"/>

  <!-- title -->
  <text x="600" y="152" text-anchor="middle" class="sans rise" font-size="64" font-weight="700" letter-spacing="-1" fill="url(#name)">Yash Srivastava</text>
  <text x="600" y="194" text-anchor="middle" class="sans rise d1" font-size="20" fill="#8b949e">DevOps  ·  Platform Engineering  ·  Applied AI</text>

  <!-- typed lines -->
  <g class="rise d2">
    <g transform="translate(393 246)" class="mono" font-size="16">
      <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
      <text x="0" y="0" fill="#3fb950">$</text>
      <text x="20" y="0" fill="#c9d1d9" textLength="394" lengthAdjust="spacingAndGlyphs" clip-path="url(#type1)">building systems that don't break at 3am</text>
      <rect class="cur" x="417" y="-14" width="9" height="18" fill="#58a6ff">
        <animate attributeName="x" values="23;417;417;23;23" keyTimes="0;0.16;0.42;0.49;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g transform="translate(335.5 246)" class="mono" font-size="16" opacity="0">
      <animate attributeName="opacity" values="0;1" keyTimes="0;0.5" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
      <text x="0" y="0" fill="#3fb950">$</text>
      <text x="20" y="0" fill="#c9d1d9" textLength="509" lengthAdjust="spacingAndGlyphs" clip-path="url(#type2)">ci/cd · kubernetes · distributed systems · applied ai</text>
      <rect class="cur" x="23" y="-14" width="9" height="18" fill="#58a6ff">
        <animate attributeName="x" values="23;23;532;532;23" keyTimes="0;0.5;0.68;0.93;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
